services:
  - type: web
    name: govwatch-app
    runtime: docker
    dockerContext: .
    dockerfilePath: ./Dockerfile.fullstack
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: govwatch-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: govwatch-redis
          property: connectionString
      - key: ENCRYPTION_KEY
        sync: false
      - key: S3_ENDPOINT
        value: http://localhost:9000
      - key: CORS_ORIGIN
        value: https://govwatch-app.onrender.com

  - type: worker
    name: govwatch-worker
    runtime: docker
    dockerContext: .
    dockerfilePath: ./Dockerfile.fullstack
    dockerCommand: node dist/worker-main.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: govwatch-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: govwatch-redis
          property: connectionString
      - key: ENCRYPTION_KEY
        sync: false

  - type: keyvalue
    name: govwatch-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: [] # private: only reachable by our own Render services

databases:
  - name: govwatch-db
    databaseName: dosje_db
    user: dosje
    plan: free
