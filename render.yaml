services:
  - type: web
    name: govwatch-app
    runtime: docker
    region: oregon # must match rediss + Postgres region: internal URLs only work in-region
    dockerContext: .
    dockerfilePath: ./Dockerfile.fullstack
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # paste your existing Postgres connection string
      - key: REDIS_URL
        sync: false # paste your existing Key Value connection string
      - key: ENCRYPTION_KEY
        sync: false
      - key: S3_ENDPOINT
        value: http://localhost:9000
      - key: CORS_ORIGIN
        value: https://govwatch-app.onrender.com

# NOTE: database/Redis creation removed from this Blueprint — this account
# already uses its one free Postgres + one free Key Value instance.
# Paste their connection strings into DATABASE_URL / REDIS_URL when deploying.
# NOTE 2: no background worker — Render free plan doesn't offer workers.
# The web service still runs the scheduler; queues fully work once upgraded.
