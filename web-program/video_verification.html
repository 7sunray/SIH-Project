    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        function InteractiveMap({ center = [28.6139, 77.209], zoom = 11, markers = [], height = '100%', className = '' }) {
            const mapContainerRef = useRef(null);
            const mapInstanceRef = useRef(null);

            useEffect(() => {
                if (!mapContainerRef.current || !window.L) return;

                if (!mapInstanceRef.current) {
                    mapInstanceRef.current = window.L.map(mapContainerRef.current, {
                        zoomControl: true,
                        scrollWheelZoom: true,
                    });

                    window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '&copy; OpenStreetMap contributors',
                        maxZoom: 19,
                    }).addTo(mapInstanceRef.current);
                }

                const map = mapInstanceRef.current;
                const markerLayer = window.L.layerGroup();

                if (markers.length > 0) {
                    const bounds = window.L.latLngBounds(markers.map((marker) => [marker.lat, marker.lng]));
                    map.fitBounds(bounds.pad(0.35));
                } else {
                    map.setView(center, zoom);
                }

                markers.forEach((marker) => {
                    const icon = window.L.divIcon({
                        className: 'custom-map-pin',
                        html: `<span style="display:flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:${marker.color || '#0f766e'};border:3px solid #fff;box-shadow:0 0 0 4px rgba(15,118,110,0.16);"></span>`,
                        iconSize: [18, 18],
                        iconAnchor: [9, 9],
                    });
                    window.L.marker([marker.lat, marker.lng], { icon }).addTo(markerLayer).bindPopup(marker.popup || marker.label || 'Location');
                });

                markerLayer.addTo(map);

                return () => {
                    markerLayer.clearLayers();
                    map.remove();
                    mapInstanceRef.current = null;
                };
            }, [center, zoom, markers]);

            return <div ref={mapContainerRef} className={`leaflet-map ${className}`} style={{ height, width: '100%' }} />;
        }

        // ============ ERROR BOUNDARY ============
        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, errorInfo: null };
            }
            static getDerivedStateFromError(error) { return { hasError: true, errorInfo: error }; }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="p-10 m-10 bg-red-50 border-2 border-red-500 rounded-xl text-red-800 font-mono">
                            <h1 className="text-2xl font-bold mb-4">React Rendering Error</h1>
                            <pre className="bg-white p-4 rounded shadow overflow-auto">{this.state.errorInfo.toString()}</pre>
                        </div>
                    );
                }
                return this.props.children; 
            }
        }

                                    { lat: institute.lat, lng: institute.lng, color: '#0f766e', popup: `<strong>${institute.name}</strong><br/>${institute.address}`, label: institute.name },
                                    { lat: institute.lat + 0.0025, lng: institute.lng - 0.0018, color: '#0ea5e9', popup: '<strong>You are here</strong><br/>Verified GPS', label: 'You are here' },
                                ]}
                            />
                        </div>
                    </div>
                    <div className="flex justify-end pt-6 border-t border-slate-100">
                        <button onClick={() => setStep(2)} className="bg-primary-800 hover:bg-primary-900 text-white font-extrabold py-4 px-10 rounded-xl transition-all shadow-md hover:-translate-y-0.5 flex items-center justify-center gap-3 text-base tracking-wide">
                            Proceed to Checklist &rarr;
                        </button>
                    </div>
                </div>
            );

            const renderStep2 = () => (
                <div className="animate-slide-up bg-white rounded-[1.5rem] p-8 custom-shadow border border-slate-100 flex flex-col items-center justify-center h-[500px]">
                    <Icons.ClipboardList />
                    <h3 className="text-2xl font-black text-slate-800 mt-4 mb-2">Checklist Interface</h3>
                    <div className="flex gap-4 mt-8">
                        <button onClick={() => setStep(1)} className="py-3.5 px-6 rounded-xl font-extrabold text-slate-500 border hover:bg-slate-50 transition-all flex items-center gap-2"><Icons.ArrowLeft /> Back</button>
                        <button onClick={() => setStep(3)} className="bg-primary-800 text-white font-extrabold py-3.5 px-8 rounded-xl hover:-translate-y-0.5 transition-all shadow-md">Proceed to Evidence &rarr;</button>
                    </div>
                </div>
            );

            const renderStep3 = () => (
                <div className="animate-slide-up bg-white rounded-[1.5rem] p-8 custom-shadow border border-slate-100 flex flex-col items-center justify-center h-[500px]">
                    <Icons.CameraIcon />
                    <h3 className="text-2xl font-black text-slate-800 mt-4 mb-2">Evidence Upload</h3>
                    <div className="flex gap-4 mt-8">
                        <button onClick={() => setStep(2)} className="py-3.5 px-6 rounded-xl font-extrabold text-slate-500 border hover:bg-slate-50 transition-all flex items-center gap-2"><Icons.ArrowLeft /> Back</button>
                        <button onClick={() => setStep(4)} className="bg-primary-800 text-white font-extrabold py-3.5 px-8 rounded-xl hover:-translate-y-0.5 transition-all shadow-md">Proceed to Report &rarr;</button>
                    </div>
                </div>
            );

            const renderStep4 = () => (
                <div className="animate-slide-up bg-white rounded-[1.5rem] p-8 custom-shadow border border-slate-100 flex flex-col items-center justify-center h-[500px]">
                    <Icons.DocumentIcon />
                    <h3 className="text-2xl font-black text-slate-800 mt-4 mb-2">Submit Report</h3>
                    <div className="flex gap-4 mt-8">
                        <button onClick={() => setStep(3)} className="py-3.5 px-6 rounded-xl font-extrabold text-slate-500 border hover:bg-slate-50 transition-all flex items-center gap-2"><Icons.ArrowLeft /> Back</button>
                        <button onClick={onNavigateDashboard} className="bg-primary-800 text-white font-extrabold py-3.5 px-8 rounded-xl hover:-translate-y-0.5 transition-all shadow-md"><Icons.CheckCircleSolid /> Submit Official Report</button>
                    </div>
                </div>
            );

            return (
                <div className="flex-1 w-full min-h-screen relative pb-20 overflow-x-hidden">
                    <div className="hero-pattern text-white pt-10 pb-36 px-8 lg:px-12 w-full rounded-bl-[2.5rem] rounded-br-[2.5rem] shadow-md relative z-0">
                        <div className="flex justify-between items-center text-sm font-semibold mb-14 max-w-7xl mx-auto relative z-10">
                            <div className="text-emerald-100/70 cursor-pointer hover:text-white transition tracking-wide uppercase text-xs font-bold" onClick={onNavigateDashboard}>Workspace &nbsp;&gt;&nbsp; <span className="text-white font-bold">Field inspection</span></div>
                        </div>
                        <div className="max-w-7xl mx-auto flex items-center gap-6 relative z-10 animate-slide-up">
                            <button onClick={onNavigateDashboard} className="w-14 h-14 rounded-full border-2 border-white/20 flex items-center justify-center hover:bg-white/20 hover:border-white/40 transition-all cursor-pointer shadow-sm"><Icons.ArrowLeft /></button>
                            <div><h2 className="text-4xl lg:text-5xl font-black tracking-tight mb-2 drop-shadow-sm">Field Inspection</h2></div>
                        </div>
                    </div>
                    <div className="px-6 lg:px-12 -mt-16 space-y-6 relative z-10 max-w-7xl mx-auto">
                        {renderStepper()}
                        {step === 1 && renderStep1()}
                        {step === 2 && renderStep2()}
                        {step === 3 && renderStep3()}
                        {step === 4 && renderStep4()}
                    </div>
                </div>
            );
        }

        // ============ PAGE 5: VIDEO VERIFICATION (NEW) ============
        function VideoVerificationPage({ onNavigate }) {
            const [checklistItems, setChecklistItems] = useState([
                { id: 'v1', label: 'Staff member on duty matches roster', checked: false },
                { id: 'v2', label: 'Beneficiaries visible & accounted for', checked: false },
                { id: 'v3', label: 'Premises match registered address', checked: false },
                { id: 'v4', label: 'No visible safety violations', checked: false },
                { id: 'v5', label: 'CCTV cameras operational on-site', checked: false },
            ]);
            
            const toggleChecklist = (id) => setChecklistItems(prev => prev.map(item => item.id === id ? { ...item, checked: !item.checked } : item));

            return (
                <div className="flex-1 w-full min-h-screen relative pb-20 overflow-x-hidden">
                    <div className="hero-pattern text-white pt-10 pb-36 px-8 lg:px-12 w-full rounded-bl-[2.5rem] rounded-br-[2.5rem] shadow-lg relative z-0">
                        <div className="flex justify-between items-center text-sm font-semibold mb-14 max-w-7xl mx-auto relative z-10">
                            <div className="flex items-center gap-4">
                                <button className="w-11 h-11 rounded-full bg-white/10 flex items-center justify-center hover:bg-white/20 transition backdrop-blur-md border border-white/20 shadow-sm" onClick={() => onNavigate('dashboard')}><Icons.ArrowLeft /></button>
                                <div className="text-emerald-100/70 tracking-wide uppercase text-xs cursor-pointer hover:text-white transition" onClick={() => onNavigate('dashboard')}>Workspace &nbsp;&gt;&nbsp; <span className="text-white font-bold">Video Verification</span></div>
                            </div>
                            <div className="flex items-center gap-2 bg-white/10 px-4 py-2 rounded-full border border-white/20 backdrop-blur-md shadow-sm">
                                <Icons.Shield /> <span className="font-extrabold tracking-wide text-xs">Secure & Verified</span>
                            </div>
                        </div>

                        <div className="max-w-7xl mx-auto relative z-10 flex justify-between items-center animate-slide-up">
                            <div><h2 className="text-4xl lg:text-5xl font-black mb-3 tracking-tight text-white drop-shadow-sm">Video Verification</h2><p className="text-emerald-100/90 text-lg font-medium leading-relaxed">Live call to confirm physical presence.</p></div>
                        </div>
                    </div>

                    <div className="px-6 lg:px-12 -mt-20 relative z-10 max-w-7xl mx-auto animate-slide-up">
                        <div className="grid grid-cols-1 lg:grid-cols-5 gap-8">
                            
                            {/* Left Pane */}
                            <div className="lg:col-span-3 flex flex-col gap-6">
                                {/* Dark Card matching screenshot */}
                                <div className="bg-gradient-to-br from-primary-800 to-primary-950 rounded-[1.5rem] p-8 md:p-10 custom-shadow border border-primary-900 flex flex-col relative overflow-hidden text-white h-full">
                                    <div className="absolute top-0 right-0 w-64 h-64 bg-emerald-500/20 rounded-full blur-[80px] -mr-10 -mt-10 pointer-events-none"></div>
                                    
                                    <div className="flex justify-between items-start mb-8 relative z-10">
                                        <div className="bg-white/10 px-4 py-2 rounded-full border border-white/20 backdrop-blur-md flex items-center gap-2 text-xs font-black uppercase tracking-widest shadow-sm">
                                            <Icons.CameraIcon /> Random
                                        </div>
                                        <div className="bg-white/10 px-4 py-2 rounded-full border border-white/20 backdrop-blur-md flex items-center gap-2 text-sm font-extrabold shadow-sm">
                                            <Icons.Clock /> 04:58
                                        </div>
                                    </div>

                                    <div className="flex flex-col md:flex-row justify-between items-end gap-8 mt-auto relative z-10 mb-8 pb-8 border-b border-white/10">
                                        <div className="flex-1">
                                            <h3 className="text-3xl font-black tracking-tight mb-4 leading-tight">Start Random<br/>Video Verification</h3>
                                            <p className="text-emerald-100/80 font-medium mb-8 max-w-sm">Unscheduled call to verify real-time presence of staff and beneficiaries.</p>
                                            <button className="bg-emerald-500 hover:bg-emerald-400 text-primary-950 font-extrabold py-3.5 px-6 rounded-xl transition-all shadow-[0_0_20px_rgba(16,185,129,0.3)] hover:shadow-[0_0_25px_rgba(16,185,129,0.5)] flex items-center gap-3 w-fit">
                                                <Icons.CameraIcon /> Initiate Random Video Call &rarr;
                                            </button>
                                        </div>
                                        
                                        <div className="flex flex-col items-center gap-3">
                                            <div className="relative">
                                                <div className="w-28 h-28 rounded-full border-4 border-white/20 overflow-hidden shadow-xl bg-white/10">
                                                    <img src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=200&q=80" alt="Inspector" className="w-full h-full object-cover" />
                                                </div>
                                                <div className="absolute bottom-0 right-0 w-8 h-8 bg-emerald-500 rounded-full border-2 border-primary-950 flex items-center justify-center text-white shadow-lg">
                                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                                                </div>
                                            </div>
                                            <span className="font-extrabold text-sm tracking-wide">Inspector Utkarsh</span>
                                        </div>
                                    </div>
                                    
                                    <div className="flex items-center justify-center relative z-10 -mb-2 text-white/50">
                                        <Icons.ShieldCheck />
                                    </div>
                                </div>

                                {/* NGO Selector */}
                                <div className="glass-card rounded-[1.25rem] p-6 custom-shadow border border-slate-100 flex items-center justify-between cursor-pointer group hover:border-primary-300 transition-colors">
                                    <div className="flex items-start gap-5">
                                        <div className="w-14 h-14 rounded-full bg-primary-800 text-white flex items-center justify-center flex-shrink-0 shadow-md">
                                            <Icons.Building />
                                        </div>
                                        <div className="pt-1">
                                            <p className="text-[0.7rem] font-black uppercase tracking-widest text-slate-400 mb-1">Reception of NGO</p>
                                            <h4 className="text-lg font-extrabold text-slate-800 group-hover:text-primary-800 transition-colors">Rukmini Shelter Home</h4>
                                            <p className="text-sm font-bold text-slate-500 flex items-center gap-1.5 mt-2">
                                                <span className="text-primary-700"><Icons.MapPin /></span> Nambikkai De-addiction Centre
                                            </p>
                                        </div>
                                    </div>
                                    <div className="text-slate-400 group-hover:text-primary-700 transition">
                                        <Icons.ChevronRight />
                                    </div>
                                </div>
                            </div>

                            {/* Right Pane */}
                            <div className="lg:col-span-2 flex flex-col gap-6">
                                <div className="glass-card rounded-[1.5rem] p-8 custom-shadow border border-slate-100 flex flex-col h-full">
                                    <div className="flex items-center gap-4 mb-6 pb-6 border-b border-slate-100">
                                        <div className="w-12 h-12 rounded-xl bg-primary-800 text-white flex items-center justify-center shadow-md">
                                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/><polyline points="9 14 11 16 15 12"/></svg>
                                        </div>
                                        <h3 className="text-xl font-extrabold text-slate-800 tracking-tight">Verification Checklist</h3>
                                    </div>
                                    
                                    <div className="space-y-2 flex-1">
                                        {checklistItems.map(item => (
                                            <div key={item.id} onClick={() => toggleChecklist(item.id)} className={`flex items-start justify-between p-4 rounded-xl cursor-pointer transition-all border border-transparent ${item.checked ? 'bg-emerald-50 border-emerald-100 shadow-sm' : 'hover:bg-slate-50 hover:border-slate-200'} group`}>
                                                <div className="flex items-start gap-4">
                                                    <div className={`w-6 h-6 mt-0.5 rounded-full flex items-center justify-center transition-all flex-shrink-0 ${item.checked ? 'bg-primary-800 text-white shadow-md scale-110' : 'bg-slate-200 text-slate-200 group-hover:bg-slate-300'}`}>
                                                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                                                    </div>
                                                    <span className={`text-[0.95rem] font-bold pt-0.5 leading-snug transition-colors ${item.checked ? 'text-primary-900' : 'text-slate-600 group-hover:text-slate-800'}`}>{item.label}</span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>

                                    <div className="mt-8 pt-6 border-t border-slate-100 flex items-center justify-between cursor-pointer group hover:bg-slate-50 p-4 rounded-xl transition border border-transparent hover:border-slate-200">
                                        <div className="flex items-center gap-4">
                                            <div className="w-10 h-10 rounded-full bg-emerald-50 text-primary-800 border border-emerald-100 flex items-center justify-center">
                                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                                            </div>
                                            <h4 className="font-extrabold text-slate-800 group-hover:text-primary-800 transition-colors">Add Notes</h4>
                                        </div>
                                        <div className="text-slate-400 group-hover:text-primary-700 transition">
                                            <Icons.ChevronRight />
                                        </div>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            );
        }

        // ============ MAIN APP CONTROLLER ============
        function App() {
            const [activePage, setActivePage] = useState('video'); // Default to Video Verification

            useEffect(() => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, [activePage]);

            return (
                <div className="flex min-h-screen bg-surface font-sans">
                    <Sidebar active={activePage} setActive={setActivePage} />
                    <div className="ml-64 w-full overflow-hidden relative">
                        <div key={activePage} className="animate-page-enter w-full min-h-screen origin-top">
                            {activePage === 'dashboard' && <Dashboard onNavigate={setActivePage} />}
                            {activePage === 'institutes' && <InstitutesPage onNavigate={setActivePage} />}
                            {activePage === 'alerts' && <AlertsPage onNavigate={setActivePage} />}
                            {activePage === 'inspection' && <FieldInspection onNavigateDashboard={() => setActivePage('dashboard')} />}
                            {activePage === 'video' && <VideoVerificationPage onNavigate={setActivePage} />}
                            
                            {/* Fallbacks */}
                            {['cctv', 'assign'].includes(activePage) && (
                                <div className="p-12 text-center text-slate-500 font-medium w-full flex flex-col items-center justify-center min-h-[80vh]">
                                    <p className="text-3xl font-black text-slate-800 capitalize mb-3 tracking-tight">{activePage.replace('-', ' ')} Page</p>
                                    <p className="text-sm mt-4 cursor-pointer bg-white px-6 py-3 rounded-xl border border-slate-200 shadow-sm text-primary-700 font-extrabold hover:bg-slate-50 hover:shadow-md transition-all" onClick={() => setActivePage('dashboard')}>
                                        Return to Dashboard
                                    </p>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // ============ RENDER ============
        ReactDOM.createRoot(document.getElementById('root')).render(
            <ErrorBoundary>
                <App />
            </ErrorBoundary>
        );
    </script>
</body>
</html>
