        const { useState, useEffect, useMemo, useRef } = React;

        function InteractiveMap({ center = [28.6139, 77.209], zoom = 11, markers = [], height = '100%', className = '' }) {
            const mapContainerRef = useRef(null);
            const mapInstanceRef = useRef(null);

            useEffect(() => {
                if (!mapContainerRef.current || !window.L) return;

                if (!mapInstanceRef.current) {
                    mapInstanceRef.current = window.L.map(mapContainerRef.current, {
                        zoomControl: true,
                        scrollWheelZoom: true,
                    });

                    window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '&copy; OpenStreetMap contributors',
                        maxZoom: 19,
                    }).addTo(mapInstanceRef.current);
                }

                const map = mapInstanceRef.current;
                const markerLayer = window.L.layerGroup();

                if (markers.length > 0) {
                    const bounds = window.L.latLngBounds(markers.map((marker) => [marker.lat, marker.lng]));
                    map.fitBounds(bounds.pad(0.35));
                } else {
                    map.setView(center, zoom);
                }

                markers.forEach((marker) => {
                    const icon = window.L.divIcon({
                        className: 'custom-map-pin',
                        html: `<span style="display:flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:${marker.color || '#0f766e'};border:3px solid #fff;box-shadow:0 0 0 4px rgba(15,118,110,0.16);"></span>`,
                        iconSize: [18, 18],
                        iconAnchor: [9, 9],
                    });
                    window.L.marker([marker.lat, marker.lng], { icon }).addTo(markerLayer).bindPopup(marker.popup || marker.label || 'Location');
                });

                markerLayer.addTo(map);

                return () => {
                    markerLayer.clearLayers();
                    map.remove();
                    mapInstanceRef.current = null;
                };
            }, [center, zoom, markers]);

            return <div ref={mapContainerRef} className={`leaflet-map ${className}`} style={{ height, width: '100%' }} />;
        }

        // ============ ERROR BOUNDARY ============
        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, errorInfo: null };
            }
            static getDerivedStateFromError(error) { return { hasError: true, errorInfo: error }; }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="p-10 m-10 bg-red-50 border-2 border-red-500 rounded-xl text-red-800 font-mono">
                            <h1 className="text-2xl font-bold mb-4">React Rendering Error</h1>
                            <pre className="bg-white p-4 rounded shadow overflow-auto">{this.state.errorInfo.toString()}</pre>
                        </div>
                    );
                }
                return this.props.children; 
            }
        }

                            <div className="flex items-center gap-4">
                                <button className="w-11 h-11 rounded-full bg-white/10 flex items-center justify-center hover:bg-white/20 transition backdrop-blur-md border border-white/20 shadow-sm" onClick={() => onNavigate('dashboard')}>
                                    <Icons.ArrowLeft />
                                </button>
                                <div className="text-emerald-100/70 tracking-wide uppercase text-xs cursor-pointer hover:text-white transition" onClick={() => onNavigate('dashboard')}>
                                    Workspace &nbsp;&gt;&nbsp; <span className="text-white font-bold">Institutes Directory</span>
                                </div>
                            </div>
                            <div className="w-11 h-11 rounded-full bg-white text-primary-800 font-black flex items-center justify-center text-sm tracking-tight shadow-xl border-[3px] border-emerald-100 cursor-pointer hover:scale-105 transition-transform">
                                US
                            </div>
                        </div>

                        <div className="max-w-7xl mx-auto relative z-10 animate-slide-up flex justify-between items-center">
                            <div>
                                <h2 className="text-4xl lg:text-5xl font-black mb-3 tracking-tight text-white drop-shadow-sm">Institutes Directory</h2>
                                <p className="text-emerald-100/90 text-lg font-medium leading-relaxed">Manage and monitor registered NGOs and shelters.</p>
                            </div>
                            <button className="hidden md:flex bg-white text-primary-800 px-6 py-3.5 rounded-xl font-extrabold shadow-lg hover:shadow-xl hover:scale-105 transition-all items-center gap-2">
                                + Register New Institute
                            </button>
                        </div>
                    </div>

                    <div className="px-6 lg:px-12 -mt-20 relative z-10 max-w-7xl mx-auto animate-slide-up">
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            
                            {/* Left Pane: Searchable List */}
                            <div className="lg:col-span-1 flex flex-col gap-6">
                                <div className="glass-card rounded-[1.25rem] p-3 pl-4 custom-shadow border border-white/50 flex items-center gap-3 text-slate-500">
                                    <Icons.Search />
                                    <input 
                                        type="text" 
                                        placeholder="Search by name or ID..." 
                                        value={search}
                                        onChange={(e) => setSearch(e.target.value)}
                                        className="w-full bg-transparent text-[0.95rem] text-slate-800 font-bold outline-none placeholder:font-semibold placeholder:text-slate-400"
                                    />
                                </div>

                                <div className="bg-white rounded-[1.5rem] p-4 custom-shadow border border-slate-100 h-[700px] flex flex-col">
                                    <div className="flex justify-between items-center px-2 pb-3 mb-2 border-b border-slate-100">
                                        <h3 className="font-extrabold text-slate-800">All Registered ({filtered.length})</h3>
                                    </div>
                                    <div className="flex-1 overflow-y-auto thin-scrollbar pr-2 pl-2 -ml-2 py-1 space-y-2">
                                        {filtered.map(inst => {
                                            const isSelected = selectedId === inst.id;
                                            return (
                                                <div 
                                                    key={inst.id} 
                                                    onClick={() => setSelectedId(inst.id)}
                                                    className={`p-4 rounded-2xl cursor-pointer transition-all duration-200 border-2 active:scale-95 ${
                                                        isSelected 
                                                        ? 'bg-primary-50 border-primary-500 shadow-md scale-[1.02]' 
                                                        : 'bg-white border-transparent hover:border-slate-200 hover:bg-slate-50'
                                                    }`}
                                                >
                                                    <div className="flex justify-between items-start mb-2">
                                                        <h4 className={`font-extrabold text-[0.95rem] leading-snug pr-4 ${isSelected ? 'text-primary-900' : 'text-slate-800'}`}>
                                                            {inst.name}
                                                        </h4>
                                                    </div>
                                                    <div className="flex items-center justify-between mt-3">
                                                        <p className={`text-xs font-bold flex items-center gap-1.5 ${isSelected ? 'text-primary-700' : 'text-slate-500'}`}>
                                                            <Icons.MapPin /> {inst.district}
                                                        </p>
                                                        <span className={`px-2.5 py-1 rounded-md text-[0.65rem] font-bold border ${getRiskColor(inst.riskScore)}`}>
                                                            {getRiskLabel(inst.riskScore)}
                                                        </span>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                        {filtered.length === 0 && (
                                            <div className="p-6 text-center text-slate-500 font-medium">No institutes found.</div>
                                        )}
                                    </div>
                                </div>
                            </div>

                            {/* Right Pane: Details (Triggers re-render animation when selectedId changes via key property) */}
                            <div className="lg:col-span-2 flex flex-col gap-6">
                                <div key={activeInst.id} className="bg-white rounded-[1.5rem] p-8 custom-shadow border border-slate-100 flex flex-col h-full animate-page-enter">
                                    
                                    {/* Header Info */}
                                    <div className="flex items-start justify-between mb-8 pb-6 border-b border-slate-100">
                                        <div className="flex items-center gap-5">
                                            <div className={`w-16 h-16 rounded-2xl ${activeInst.iconColor} text-white flex items-center justify-center flex-shrink-0 shadow-lg`}>
                                                <Icons.Building />
                                            </div>
                                            <div>
                                                <h2 className="text-3xl font-black text-slate-800 tracking-tight mb-1">{activeInst.name}</h2>
                                                <div className="flex flex-wrap items-center gap-3 text-sm text-slate-500 font-bold mt-1.5">
                                                    <span className="bg-slate-100 px-2.5 py-1 rounded-md text-slate-700 shadow-sm border border-slate-200">ID: {activeInst.id}</span>
                                                    <span className="w-1.5 h-1.5 rounded-full bg-slate-300"></span>
                                                    <span>{activeInst.type}</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Map Area */}
                                    <div className="w-full h-[220px] rounded-2xl overflow-hidden border border-slate-200 shadow-inner mb-8">
                                        <InteractiveMap
                                            center={[28.6139, 77.209]}
                                            zoom={11}
                                            height="220px"
                                            markers={[
                                                { lat: activeInst.lat, lng: activeInst.lng, color: '#0f766e', popup: `<strong>${activeInst.name}</strong><br/>${activeInst.address}`, label: activeInst.name },
                                                { lat: activeInst.lat + 0.0025, lng: activeInst.lng - 0.0018, color: '#0ea5e9', popup: '<strong>Your GPS</strong><br/>Live verified', label: 'You are here' },
                                            ]}
                                        />
                                    </div>

                                    {/* Key Stats Grid */}
                                    <h3 className="text-lg font-extrabold text-slate-800 mb-4">Key Metrics</h3>
                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                                        <div className="bg-slate-50 rounded-xl p-4 border border-slate-100 flex flex-col justify-between">
                                            <div className="flex items-center gap-2 text-amber-500 mb-2"><Icons.Activity /></div>
                                            <div className="text-2xl font-black text-slate-800">{activeInst.riskScore}</div>
                                            <div className="text-[0.7rem] font-bold text-slate-500 uppercase tracking-widest mt-1">Risk Score</div>
                                        </div>
                                        <div className="bg-slate-50 rounded-xl p-4 border border-slate-100 flex flex-col justify-between">
                                            <div className="flex items-center gap-2 text-blue-500 mb-2"><Icons.UsersIcon /></div>
                                            <div className="text-2xl font-black text-slate-800">{activeInst.beneficiaries}</div>
                                            <div className="text-[0.7rem] font-bold text-slate-500 uppercase tracking-widest mt-1">Beneficiaries</div>
                                        </div>
                                        <div className="bg-slate-50 rounded-xl p-4 border border-slate-100 flex flex-col justify-between">
                                            <div className="flex items-center gap-2 text-purple-500 mb-2"><Icons.Clipboard /></div>
                                            <div className="text-2xl font-black text-slate-800">{activeInst.staff}</div>
                                            <div className="text-[0.7rem] font-bold text-slate-500 uppercase tracking-widest mt-1">Staff on record</div>
                                        </div>
                                        <div className="bg-slate-50 rounded-xl p-4 border border-slate-100 flex flex-col justify-between">
                                            <div className="flex items-center gap-2 text-emerald-500 mb-2"><Icons.CheckCircleSolid /></div>
                                            <div className="text-2xl font-black text-slate-800">{activeInst.attendanceToday}</div>
                                            <div className="text-[0.7rem] font-bold text-slate-500 uppercase tracking-widest mt-1">Attendance Today</div>
                                        </div>
                                    </div>

                                    {/* Detailed Info */}
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10 border-t border-slate-100 pt-6">
                                        <div className="flex items-start gap-3">
                                            <div className="text-slate-400 mt-0.5"><Icons.MapPin /></div>
                                            <div>
                                                <p className="text-[0.75rem] font-bold text-slate-400 uppercase tracking-wider mb-0.5">Full Address</p>
                                                <p className="text-[0.95rem] font-bold text-slate-700 leading-snug">{activeInst.address}</p>
                                            </div>
                                        </div>
                                        <div className="flex items-start gap-3">
                                            <div className="text-slate-400 mt-0.5"><Icons.Phone /></div>
                                            <div>
                                                <p className="text-[0.75rem] font-bold text-slate-400 uppercase tracking-wider mb-0.5">Contact Number</p>
                                                <p className="text-[0.95rem] font-bold text-slate-700">{activeInst.phone}</p>
                                            </div>
                                        </div>
                                        <div className="flex items-start gap-3">
                                            <div className="text-slate-400 mt-0.5"><Icons.Calendar /></div>
                                            <div>
                                                <p className="text-[0.75rem] font-bold text-slate-400 uppercase tracking-wider mb-0.5">Last Inspection Date</p>
                                                <p className="text-[0.95rem] font-bold text-slate-700">{activeInst.lastInsp}</p>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Action Bar */}
                                    <div className="flex flex-col sm:flex-row items-center gap-4 mt-auto pt-6 border-t border-slate-100">
                                        <button className="w-full sm:flex-1 bg-primary-800 hover:bg-primary-900 text-white font-extrabold py-3.5 px-6 rounded-xl transition-all shadow-md hover:-translate-y-0.5 flex items-center justify-center gap-2">
                                            <Icons.VideoCall /> Start Video Call
                                        </button>
                                        <button onClick={() => onNavigate('inspection')} className="w-full sm:flex-1 bg-white border-2 border-slate-200 text-slate-700 hover:border-primary-300 hover:text-primary-800 font-extrabold py-3.5 px-6 rounded-xl transition-all shadow-sm hover:-translate-y-0.5 flex items-center justify-center gap-2">
                                            <Icons.Clipboard /> Request Inspection
                                        </button>
                                        <button className="w-full sm:w-auto bg-red-50 hover:bg-red-100 border border-red-200 text-red-600 font-extrabold py-3.5 px-6 rounded-xl transition-all flex items-center justify-center gap-2">
                                            <Icons.Flag /> Flag Institute
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // ============ MAIN APP CONTROLLER ============
        function App() {
            // Set exact default page based on user request
            const [activePage, setActivePage] = useState('institutes');

            // Scroll to top automatically when changing tabs
            useEffect(() => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, [activePage]);

            return (
                <div className="flex min-h-screen bg-surface font-sans">
                    <Sidebar active={activePage} setActive={setActivePage} />
                    <div className="ml-64 w-full overflow-hidden relative">
                        {/* Wrapper for smooth CSS entrance animation on page load/switch */}
                        <div key={activePage} className="animate-page-enter w-full min-h-screen origin-top">
                            {activePage === 'institutes' && <InstitutesPage onNavigate={setActivePage} />}
                            
                            {/* Fallbacks for other pages so clicking navigation doesn't crash */}
                            {activePage !== 'institutes' && (
                                <div className="p-12 text-center text-slate-500 font-medium w-full flex flex-col items-center justify-center min-h-[80vh]">
                                    <p className="text-3xl font-black text-slate-800 capitalize mb-3 tracking-tight">{activePage.replace('-', ' ')} Page</p>
                                    <p className="text-sm mt-4 cursor-pointer bg-white px-6 py-3 rounded-xl border border-slate-200 shadow-sm text-primary-700 font-extrabold hover:bg-slate-50 hover:shadow-md transition-all" onClick={() => setActivePage('institutes')}>
                                        Return to Institutes Directory
                                    </p>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // ============ RENDER ============
        ReactDOM.createRoot(document.getElementById('root')).render(
            <ErrorBoundary>
                <App />
            </ErrorBoundary>
        );
    </script>
</body>
</html>
