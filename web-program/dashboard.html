<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GovWatch - Premium Inspector Dashboard</title>
    
    <!-- Premium Font Import -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'] 
                    },
                    colors: {
                        primary: {
                            50: '#f0fdfa', 100: '#ccfbf1', 200: '#99f6e4', 300: '#5eead4', 
                            400: '#2dd4bf', 500: '#14b8a6', 600: '#0d9488', 700: '#0f766e', 
                            800: '#115e59', 900: '#134e4a', DEFAULT: '#0f766e' 
                        },
                        surface: '#f8fafc',
                    },
                    animation: {
                        'slide-up': 'slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'radar-sweep': 'sweep 3s linear infinite',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(25px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        sweep: {
                            '0%': { transform: 'translate(-50%, -50%) rotate(0deg)' },
                            '100%': { transform: 'translate(-50%, -50%) rotate(360deg)' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                }
            }
        }
    </script>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    
    <style>
        body { background-color: theme('colors.surface'); color: #0f172a; }
        .sidebar-link { transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
        .sidebar-link:hover:not(.active) { background-color: #f1f5f9; transform: translateX(6px); }
        .sidebar-link.active { background-color: theme('colors.primary.700'); color: white; box-shadow: 0 4px 14px rgba(15, 118, 110, 0.25); }
        .sidebar-link.active svg { stroke: white; }
        
        .custom-shadow { box-shadow: 0 12px 40px -12px rgba(0, 0, 0, 0.08); }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Premium Custom Scrollbar for inner lists */
        .thin-scrollbar::-webkit-scrollbar { width: 5px; }
        .thin-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .thin-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .thin-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Premium Hero Pattern */
        .hero-pattern {
            background-color: #0f766e;
            background-image: radial-gradient(circle at 100% 0%, #115e59 0%, transparent 50%),
                              radial-gradient(circle at 0% 100%, #134e4a 0%, transparent 50%);
            position: relative; overflow: hidden;
        }
        .hero-pattern::before {
            content: ''; position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: url('data:image/svg+xml,%3Csvg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg"%3E%3Cg fill="none" fill-rule="evenodd"%3E%3Cg fill="%23ffffff" fill-opacity="0.04"%3E%3Cpath d="M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z"/%3E%3C/g%3E%3C/g%3E%3C/svg%3E');
            animation: float 25s linear infinite;
        }

        /* Radar Map Animation */
        .map-bg {
            background-color: #f0f9ff;
            background-image: radial-gradient(#bae6fd 2px, transparent 2px);
            background-size: 28px 28px;
        }
        .pulse-dot {
            width: 18px; height: 18px; background-color: #0ea5e9;
            border-radius: 50%; border: 3px solid white;
            position: relative; z-index: 10; box-shadow: 0 4px 12px rgba(14, 165, 233, 0.4);
        }
        .radar-sweep {
            position: absolute; top: 50%; left: 50%;
            width: 180px; height: 180px; transform-origin: 0 0;
            background: conic-gradient(from 0deg, rgba(14, 165, 233, 0) 70%, rgba(14, 165, 233, 0.3) 100%);
            border-radius: 50%;
        }
        
        .stagger-1 { animation-delay: 0.05s; }
        .stagger-2 { animation-delay: 0.1s; }
        .stagger-3 { animation-delay: 0.15s; }
        .stagger-4 { animation-delay: 0.2s; }

        .dashboard-shell {
            background-color: #f8fafc;
            background-image: linear-gradient(rgba(15, 118, 110, 0.035) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(15, 118, 110, 0.035) 1px, transparent 1px),
                              radial-gradient(circle at 92% 18%, rgba(45, 212, 191, 0.12), transparent 24rem),
                              radial-gradient(circle at 8% 58%, rgba(14, 165, 233, 0.08), transparent 22rem);
            background-size: 32px 32px, 32px 32px, auto, auto;
        }
        .metric-card::before {
            content: '';
            position: absolute;
            inset: 0 0 auto;
            height: 4px;
            background: linear-gradient(90deg, #0f766e, #2dd4bf);
            opacity: 0;
            transition: opacity 0.25s ease;
        }
        .metric-card:hover::before { opacity: 1; }
        .status-dot { animation: statusPulse 2s ease-in-out infinite; }
        @keyframes statusPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.45); }
            50% { box-shadow: 0 0 0 7px rgba(52, 211, 153, 0); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

            Shield: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>,

            ArrowLeft: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>,

            CheckCircleSolid: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="#0f766e"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" fill="#ffffff"/></svg>,
            Search: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>,

            UsersIcon: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
            CameraIcon: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>,

            Refresh: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.92-10.44l5.66 5.66"/></svg>
        };

        // ============ NAVIGATION Sidebar ============
        function Sidebar({ active, setActive }) {
            const workspaceItems = [
                { id: 'dashboard', label: 'Dashboard', icon: <Icons.Dashboard /> },
                { id: 'inspection', label: 'Field inspection', icon: <Icons.Clipboard /> },
                { id: 'cctv', label: 'Live CCTV', icon: <Icons.CCTV /> },
                { id: 'alerts', label: 'AI anomaly alerts', icon: <Icons.Alert />, badge: '7' },
                { id: 'institutes', label: 'Institutes', icon: <Icons.Building /> },
            ];

            const managementItems = [
                { id: 'assign', label: 'Assign inspections', icon: <Icons.Calendar /> },
                { id: 'video', label: 'Video verification', icon: <Icons.Video /> },
            ];

            return (
                <div className="w-64 bg-white border-r border-slate-200 py-6 px-4 flex flex-col h-screen fixed left-0 top-0 z-40 shadow-[4px_0_24px_rgba(0,0,0,0.02)]">
                    <div className="flex items-center gap-3 mb-10 px-2 cursor-pointer" onClick={() => window.location.href = 'dashboard.html'}>
                        <Icons.Leaf />
                        <div>
                            <h1 className="text-2xl font-black text-slate-800 leading-tight tracking-tight">GovWatch</h1>
                            <p className="text-[0.55rem] font-bold text-primary-700 tracking-[0.15em] mt-0.5">CARE. COMPLIANCE. TRUST.</p>
                        </div>
                    </div>

                    <div className="flex flex-col gap-1 mb-8">
                        <p className="text-[0.65rem] font-extrabold text-slate-400 tracking-wider mb-2 px-3">WORKSPACE</p>
                        {workspaceItems.map(item => (
                            <button
                                key={item.id}
                                onClick={() => {
                                    const routes = { dashboard: 'dashboard.html', inspection: 'field.html', cctv: 'cctv_feed.html', alerts: 'ai_anomaly.html', institutes: 'institutes_directory.html' };
                                    if (routes[item.id]) window.location.href = routes[item.id];
                                }}
                                className={`sidebar-link w-full flex items-center justify-between px-3 py-3 rounded-xl text-[0.9rem] font-bold ${
                                    active === item.id ? 'active' : 'text-slate-500'
                                }`}
                            >
                                <div className="flex items-center gap-3">
                                    <span className="opacity-80">{item.icon}</span>
                                    {item.label}
                                </div>
                                {item.badge && (
                                    <span className={`text-[0.65rem] px-2 py-0.5 rounded-full font-bold shadow-sm ${active === item.id ? 'bg-white/20 text-white' : 'bg-emerald-100 text-primary-700'}`}>
                                        {item.badge}
                                    </span>
                                )}
                            </button>
                        ))}
                    </div>

                    <div className="flex flex-col gap-1 mt-auto pb-4">
                        <p className="text-[0.65rem] font-extrabold text-slate-400 tracking-wider mb-2 px-3">MANAGEMENT</p>
                        {managementItems.map(item => (
                            <button
                                key={item.id}
                                onClick={() => {
                                    const routes = { assign: 'inspections.html', video: 'video_verification.html' };
                                    if (routes[item.id]) window.location.href = routes[item.id];
                                }}
                                className={`sidebar-link w-full flex items-center gap-3 px-3 py-3 rounded-xl text-[0.9rem] font-bold ${
                                    active === item.id ? 'active' : 'text-slate-500'
                                }`}
                            >
                                <span className="opacity-80">{item.icon}</span>
                                {item.label}
                            </button>
                        ))}
                    </div>
                </div>
            );
        }

        // ============ PAGE 1: DASHBOARD ============
        function Dashboard({ onNavigateInspection }) {
            const [filter, setFilter] = useState('All');
            const filters = ['All', 'Compliance', 'Geo-tagged', 'Urgent Action'];
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            const mockNearbyList = [
                { id: '1', name: 'Bharat Sevashram', city: 'New Delhi', dist: '2.4 km away', score: 92, iconColor: 'bg-primary-800', typeIcon: <Icons.Building />, status: 'Compliant' },
                { id: '2', name: 'Hostel #12', city: 'Dwarka', dist: '3.1 km away', score: 45, iconColor: 'bg-blue-500', typeIcon: <Icons.Home />, status: 'Urgent' },
                { id: '3', name: 'Asha Kiran Welfare', city: 'Janakpuri', dist: '4.8 km away', score: 88, iconColor: 'bg-primary-700', typeIcon: <Icons.Building />, status: 'Compliant' },
                { id: '4', name: 'Sankalp Child Home', city: 'Rohini', dist: '5.2 km away', score: 65, iconColor: 'bg-amber-500', typeIcon: <Icons.Home />, status: 'Pending' },
                { id: '5', name: 'Nav Jeevan Center', city: 'Pitampura', dist: '7.0 km away', score: 78, iconColor: 'bg-purple-500', typeIcon: <Icons.Building />, status: 'Compliant' },
                { id: '6', name: 'Roshan Aangan', city: 'Vasant Kunj', dist: '8.5 km away', score: 95, iconColor: 'bg-teal-500', typeIcon: <Icons.Building />, status: 'Compliant' },
            ];

            const liveFeed = [

            const evidenceMock = [

            // ---------------- STEP 1 RENDER ----------------
            const renderStep1 = () => (

                <div className="flex-1 w-full min-h-screen relative pb-20">
                    <div className="hero-pattern text-white pt-8 pb-32 px-8 lg:px-12 w-full rounded-bl-[2.5rem] rounded-br-[2.5rem] shadow-md relative z-0">
                        <div className="flex justify-between items-center text-sm font-medium mb-12 max-w-7xl mx-auto relative z-10">
                            <div className="text-emerald-100/70 cursor-pointer hover:text-white transition tracking-wide uppercase text-xs font-semibold" onClick={onNavigateDashboard}>
                                Workspace &nbsp;&gt;&nbsp; <span className="text-white font-bold">Field inspection</span>
                            </div>
                            <div className="flex items-center gap-6">
                                <div className="flex items-center gap-2 bg-white/10 px-4 py-2 rounded-full border border-white/20 backdrop-blur-md shadow-sm">
                                    <Icons.Shield /> <span className="font-extrabold tracking-wide text-xs">Secure Session</span>
                                </div>
                            </div>
                        </div>
                        <div className="max-w-7xl mx-auto flex items-center gap-6 relative z-10 animate-slide-up">
                            <button onClick={onNavigateDashboard} className="w-14 h-14 rounded-full border-2 border-white/20 flex items-center justify-center hover:bg-white/20 hover:border-white/40 transition-all cursor-pointer shadow-sm">
                                <Icons.ArrowLeft />
                            </button>
                            <div>
                                <h2 className="text-4xl lg:text-5xl font-black tracking-tight mb-2 drop-shadow-sm">Field Inspection</h2>
                                <p className="text-emerald-100 text-lg font-medium">On-site verification workflow</p>
                            </div>
                        </div>
                    </div>

                    <div className="px-6 lg:px-12 -mt-16 space-y-6 relative z-10 max-w-7xl mx-auto">
                        {renderStepper()}
                        {step !== 4 && (
                            <div className="glass-card rounded-[1.5rem] p-6 lg:p-8 custom-shadow border border-white/50 flex flex-col lg:flex-row items-center justify-between gap-6 w-full mb-6 animate-slide-up">
                                <div className="flex items-center gap-5 w-full lg:w-auto">
                                    <div className="w-16 h-16 rounded-2xl bg-emerald-50 text-primary-800 flex items-center justify-center flex-shrink-0 border border-emerald-100 shadow-inner"><Icons.Home /></div>
                                    <div>
                                        <h3 className="text-2xl font-black text-slate-800 mb-1 tracking-tight">{institute.name}</h3>
                                        <div className="flex flex-wrap items-center gap-3 text-sm text-slate-500 font-bold mt-1.5">
                                            <span className="bg-slate-100 px-2.5 py-1 rounded-md text-slate-700 shadow-sm border border-slate-200">ID: {institute.id}</span>
                                            <span className="w-1.5 h-1.5 rounded-full bg-slate-300"></span>
                                            <span>Ref: INS-2026-08841</span>
                                        </div>
                                    </div>
                                </div>
                                <div className="hidden lg:flex items-center gap-10 w-full lg:w-auto border-t lg:border-t-0 border-slate-100 pt-4 lg:pt-0">
                                    <div><p className="text-[0.7rem] text-slate-400 font-black uppercase tracking-widest mb-1">Contact</p><p className="text-[0.95rem] font-extrabold text-slate-700">{institute.phone}</p></div>
                                    <div className="w-px h-12 bg-slate-100"></div>
                                    <div><p className="text-[0.7rem] text-slate-400 font-black uppercase tracking-widest mb-1">Last Checked</p><p className="text-[0.95rem] font-extrabold text-slate-700">{institute.lastInsp}</p></div>
                                    <div className="w-px h-12 bg-slate-100"></div>
                                    <div className="flex flex-col items-end"><span className="bg-emerald-50 text-primary-800 px-5 py-2.5 rounded-xl text-xs font-black tracking-widest uppercase border border-emerald-200 shadow-sm">Field Assignment</span></div>
                                </div>
                            </div>
                        )}
                        {step === 1 && renderStep1()}
                        {step === 2 && renderStep2()}
                        {step === 3 && renderStep3()}
                        {step === 4 && renderStep4()}
                    </div>
                </div>
            );
        }

        // ============ MAIN APP CONTROLLER ============
        function App() {
            const [activePage, setActivePage] = useState('dashboard');

            return (
                <div className="flex min-h-screen bg-surface font-sans">
                    <Sidebar active={activePage} setActive={setActivePage} />
                    <div className="ml-64 w-full overflow-hidden">
                        {activePage === 'dashboard' && <Dashboard onNavigateInspection={() => window.location.href = 'field.html'} />}
                        {activePage === 'inspection' && <FieldInspection onNavigateDashboard={() => window.location.href = 'dashboard.html'} />}
                        
                        {['cctv', 'alerts', 'institutes', 'assign', 'video'].includes(activePage) && (
                            <div className="p-12 text-center text-slate-500 font-medium w-full flex flex-col items-center justify-center min-h-[80vh]">
                                <p className="text-3xl font-black text-slate-800 capitalize mb-3 tracking-tight">{activePage.replace('-', ' ')} Page</p>
                                <p className="text-sm mt-4 cursor-pointer bg-white px-6 py-3 rounded-xl border border-slate-200 shadow-sm text-primary-700 font-extrabold hover:bg-slate-50 hover:shadow-md transition-all" onClick={() => window.location.href = 'dashboard.html'}>
                                    Return to Dashboard
                                </p>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // ============ RENDER ============
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
