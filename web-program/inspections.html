                        slideUp: {

                            '0%, 100%': { transform: 'translateY(0)' },

                        <div className="p-10 m-10 bg-red-50 border-2 border-red-500 rounded-xl text-red-800 font-mono">

                            <pre className="bg-white p-4 rounded shadow overflow-auto">{this.state.errorInfo.toString()}</pre>

            ReportList: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        };

        // ============ SIDEBAR COMPONENT ============
        function Sidebar({ active, setActive }) {
            const workspaceItems = [
                { id: 'dashboard', label: 'Dashboard', icon: <Icons.Dashboard /> },
                { id: 'inspection', label: 'Field inspection', icon: <Icons.Clipboard /> },
                { id: 'cctv', label: 'Live CCTV', icon: <Icons.CCTV /> },
                { id: 'alerts', label: 'AI anomaly alerts', icon: <Icons.Alert /> },
                { id: 'institutes', label: 'Institutes', icon: <Icons.Building /> },
            ];

            const managementItems = [
                { id: 'assign', label: 'Assign inspections', icon: <Icons.Calendar /> },
                { id: 'video', label: 'Video verification', icon: <Icons.Video /> },
            ];

            return (
                <div className="w-64 bg-white border-r border-slate-200 py-6 px-4 flex flex-col h-screen fixed left-0 top-0 z-40 shadow-[4px_0_24px_rgba(0,0,0,0.02)]">
                    <div className="flex items-center gap-3 mb-10 px-2 cursor-pointer" onClick={() => window.location.href = 'dashboard.html'}>
                        <Icons.Leaf />
                        <div>
                            <h1 className="text-2xl font-black text-slate-800 leading-tight tracking-tight">GovWatch</h1>
                            <p className="text-[0.55rem] font-bold text-primary-700 tracking-[0.15em] mt-0.5">CARE. COMPLIANCE. TRUST.</p>
                        </div>
                    </div>

                    <div className="flex flex-col gap-1 mb-8">
                        <p className="text-[0.65rem] font-extrabold text-slate-400 tracking-wider mb-2 px-3">WORKSPACE</p>
                        {workspaceItems.map(item => (
                            <button key={item.id} onClick={() => {
                                const routes = { dashboard: 'dashboard.html', inspection: 'field.html', cctv: 'cctv_feed.html', alerts: 'ai_anomaly.html', institutes: 'institutes_directory.html' };
                                if (routes[item.id]) window.location.href = routes[item.id];
                            }} className={`sidebar-link w-full flex items-center justify-between px-3 py-3 rounded-xl text-[0.9rem] font-bold ${active === item.id ? 'active' : 'text-slate-500'}`}>
                                <div className="flex items-center gap-3"><span className="opacity-80">{item.icon}</span> {item.label}</div>
                            </button>
                        ))}
                    </div>

                    <div className="flex flex-col gap-1 mt-auto pb-4">
                        <p className="text-[0.65rem] font-extrabold text-slate-400 tracking-wider mb-2 px-3">MANAGEMENT</p>
                        {managementItems.map(item => (
                            <button key={item.id} onClick={() => {
                                const routes = { assign: 'inspections.html', video: 'video_verification.html' };
                                if (routes[item.id]) window.location.href = routes[item.id];
                            }} className={`sidebar-link w-full flex items-center gap-3 px-3 py-3 rounded-xl text-[0.9rem] font-bold ${active === item.id ? 'active' : 'text-slate-500'}`}>
                                <span className="opacity-80">{item.icon}</span> {item.label}
                            </button>
                        ))}
                    </div>
                </div>
            );
        }

        // ============ PAGE: ASSIGN INSPECTIONS ============
        function AssignInspectionsPage({ onNavigate }) {
            const [search, setSearch] = useState('');
            const [assignments, setAssignments] = useState({});

            const mockPending = [
                { id: 'MSJE/DL/00231', name: 'Rukmini Shelter Home for Women', district: 'Dwarka, Delhi', risk: 78, lastInsp: '12 Jun 2026', priority: 'High', defaultAssign: 'Utkarsh Singh' },
                { id: 'MSJE/TN/00456', name: 'Nambikkai De-addiction Centre', district: 'Coimbatore, TN', risk: 54, lastInsp: '04 Feb 2026', priority: 'Medium', defaultAssign: 'Karthik Subramaniam' },
                { id: 'MSJE/WB/00902', name: 'Nirmal Jyoti Disability Rehab Centre', district: 'Kolkata, WB', risk: 83, lastInsp: '19 May 2026', priority: 'High', defaultAssign: 'Debashish Roy' },
                { id: 'MSJE/KA/00678', name: 'Snehalaya Child Development Centre', district: 'Bengaluru, Karnataka', risk: 46, lastInsp: '11 Mar 2026', priority: 'Medium', defaultAssign: 'Lakshmi Narayan' },
            ];

            const officers = ['Utkarsh Singh', 'Karthik Subramaniam', 'Debashish Roy', 'Lakshmi Narayan', 'Anjali Kapoor', 'Priya Sharma'];

            const getRiskBar = (score) => {
                const color = score >= 70 ? 'bg-red-500' : score >= 40 ? 'bg-amber-500' : 'bg-emerald-500';
                return (
                    <div className="flex flex-col gap-1 w-16">
                        <div className="w-full h-1.5 bg-slate-100 rounded-full overflow-hidden">
                            <div className={`h-full rounded-full ${color}`} style={{ width: `${score}%` }}></div>
                        </div>
                        <span className="text-xs font-bold text-slate-700">{score}</span>
                    </div>
                );
            };

            const getPriorityBadge = (priority) => {
                if (priority === 'High') return <span className="px-2.5 py-1 rounded-md text-[0.7rem] font-bold bg-red-50 text-red-600 border border-red-100">High</span>;
                if (priority === 'Medium') return <span className="px-2.5 py-1 rounded-md text-[0.7rem] font-bold bg-amber-50 text-amber-600 border border-amber-100">Medium</span>;
                return <span className="px-2.5 py-1 rounded-md text-[0.7rem] font-bold bg-emerald-50 text-emerald-600 border border-emerald-100">Low</span>;
            };

            const handleAssignChange = (id, value) => {
                setAssignments(prev => ({ ...prev, [id]: value }));
            };

            return (
                <div className="flex-1 w-full min-h-screen relative pb-10 bg-surface">
                    
                    {/* Premium Hero Header */}
                    <div className="hero-pattern text-white pt-10 pb-36 px-8 lg:px-12 w-full rounded-bl-[2.5rem] rounded-br-[2.5rem] shadow-lg relative z-0">
                        <div className="flex justify-between items-center text-sm font-semibold mb-14 max-w-7xl mx-auto relative z-10">
                            <div className="flex items-center gap-4">
                                <button className="w-11 h-11 rounded-full bg-white/10 flex items-center justify-center hover:bg-white/20 transition backdrop-blur-md border border-white/20 shadow-sm" onClick={() => onNavigate('dashboard')}><Icons.ArrowLeft /></button>
                                <div className="text-emerald-100/70 tracking-wide uppercase text-xs cursor-pointer hover:text-white transition" onClick={() => onNavigate('dashboard')}>Workspace &nbsp;&gt;&nbsp; <span className="text-white font-bold">Assign Inspections</span></div>
                            </div>
                            <div className="flex items-center gap-2 bg-white/10 px-4 py-2 rounded-full border border-white/20 backdrop-blur-md shadow-sm">
                                <Icons.Shield /> <span className="font-extrabold tracking-wide text-xs">Secure & Verified</span>
                            </div>
                        </div>

                        <div className="max-w-7xl mx-auto relative z-10 animate-slide-up flex justify-between items-center">
                            <div><h2 className="text-4xl lg:text-5xl font-black mb-3 tracking-tight text-white drop-shadow-sm">Assign Inspections</h2><p className="text-emerald-100/90 text-lg font-medium leading-relaxed">District-wise inspection workload</p></div>
                        </div>
                    </div>

                    <div className="px-6 lg:px-12 -mt-20 relative z-10 max-w-7xl mx-auto">
                        
                        {/* Floating Control Bar */}
                        <div className="glass-card rounded-[1.5rem] p-4 lg:p-6 custom-shadow border border-white/50 flex flex-col lg:flex-row items-center justify-between gap-6 mb-8 animate-slide-up stagger-1">
                            <div className="flex items-center gap-3 text-slate-400 w-full lg:w-1/2 bg-slate-50/50 px-4 py-3 rounded-xl border border-slate-200">
                                <Icons.Search />
                                <input type="text" placeholder="Search institutes, IDs, district" value={search} onChange={(e) => setSearch(e.target.value)} className="w-full bg-transparent text-[0.95rem] text-slate-800 font-bold outline-none placeholder:font-semibold placeholder:text-slate-400" />
                            </div>
                            <div className="flex items-center gap-6 w-full lg:w-auto justify-between lg:justify-end">
                                <div className="relative cursor-pointer hover:scale-105 transition-transform">
                                    <div className="text-slate-500"><Icons.Bell /></div>
                                    <span className="absolute -top-1.5 -right-1.5 w-4 h-4 bg-red-500 rounded-full border-2 border-white flex items-center justify-center text-[0.55rem] font-black text-white">6</span>
                                </div>
                                <div className="w-px h-10 bg-slate-200"></div>
                                <div className="flex items-center gap-3">
                                    <div className="w-10 h-10 rounded-xl bg-primary-50 text-primary-700 flex items-center justify-center border border-primary-100"><Icons.Calendar /></div>
                                    <div>
                                        <p className="text-[0.9rem] font-extrabold text-slate-800 leading-tight">06:21 pm</p>
                                        <p className="text-xs font-semibold text-slate-500">6 Sept 2026</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Metric Grid */}
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                            {[
                                { title: 'Pending\ninspections', val: '154', icon: <Icons.ClipboardList/>, color: 'text-primary-700 bg-emerald-50' },
                                { title: 'Assigned this\nweek', val: '42', icon: <Icons.CalendarGrid/>, color: 'text-blue-600 bg-blue-50' },
                                { title: 'Overdue > 7 days', val: '28', icon: <Icons.Clock/>, color: 'text-primary-800 bg-primary-100' },
                                { title: 'Field officers\nactive', val: '19', icon: <Icons.UsersIcon/>, color: 'text-teal-700 bg-teal-50' }
                            ].map((card, idx) => (
                                <div key={idx} className={`bg-white rounded-[1.5rem] p-6 custom-shadow border border-slate-100 relative overflow-hidden group hover:shadow-xl hover:-translate-y-1 transition-all animate-slide-up stagger-2 flex items-center gap-5`}>
                                    <div className={`w-14 h-14 rounded-[1.1rem] ${card.color} flex items-center justify-center flex-shrink-0 shadow-sm border border-white`}>{card.icon}</div>
                                    <div>
                                        <div className="text-2xl font-black text-slate-800 tracking-tight leading-none mb-1">{card.val}</div>
                                        <h3 className="text-[0.8rem] font-bold text-slate-500 leading-snug whitespace-pre-line">{card.title}</h3>
                                    </div>
                                </div>
                            ))}
                        </div>

                        {/* Main Data Table Area */}
                        <div className="bg-white rounded-[1.5rem] custom-shadow border border-slate-100 flex flex-col overflow-hidden animate-slide-up stagger-3">
                            <div className="p-8 pb-6 border-b border-slate-100">
                                <h3 className="text-2xl font-extrabold text-slate-800 tracking-tight mb-1">Institutes requiring inspection</h3>
                                <p className="text-sm font-semibold text-slate-500">Prioritised by AI risk score and time since last visit</p>
                            </div>
                            
                            <div className="overflow-x-auto w-full">
                                <table className="w-full text-left border-collapse">
                                    <thead>
                                        <tr className="border-b border-slate-100">
                                            <th className="px-8 py-4 text-[0.65rem] font-extrabold text-slate-400 uppercase tracking-widest whitespace-nowrap">Institute</th>
                                            <th className="px-6 py-4 text-[0.65rem] font-extrabold text-slate-400 uppercase tracking-widest whitespace-nowrap">District</th>
                                            <th className="px-6 py-4 text-[0.65rem] font-extrabold text-slate-400 uppercase tracking-widest whitespace-nowrap">Risk Score</th>
                                            <th className="px-6 py-4 text-[0.65rem] font-extrabold text-slate-400 uppercase tracking-widest whitespace-nowrap">Last Inspection</th>
                                            <th className="px-6 py-4 text-[0.65rem] font-extrabold text-slate-400 uppercase tracking-widest whitespace-nowrap">Priority</th>
                                            <th className="px-6 py-4 text-[0.65rem] font-extrabold text-slate-400 uppercase tracking-widest whitespace-nowrap">Assign To</th>
                                            <th className="px-8 py-4 text-[0.65rem] font-extrabold text-slate-400 uppercase tracking-widest text-right whitespace-nowrap">Action</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {mockPending.map((inst) => (
                                            <tr key={inst.id} className="hover:bg-slate-50/80 transition-colors group">
                                                <td className="px-8 py-5 min-w-[250px]">
                                                    <p className="font-extrabold text-[0.95rem] text-slate-800 leading-snug mb-1 group-hover:text-primary-800 transition-colors">{inst.name}</p>
                                                    <p className="text-xs font-bold text-slate-400 tracking-wide">{inst.id}</p>
                                                </td>
                                                <td className="px-6 py-5">
                                                    <p className="font-bold text-slate-600 text-sm whitespace-pre-line">{inst.district.replace(', ', ',\n')}</p>
                                                </td>
                                                <td className="px-6 py-5 align-middle">
                                                    {getRiskBar(inst.risk)}
                                                </td>
                                                <td className="px-6 py-5 whitespace-nowrap">
                                                    <p className="font-bold text-slate-800 text-sm">{inst.lastInsp.split(' ')[0]} {inst.lastInsp.split(' ')[1]}</p>
                                                    <p className="text-xs font-semibold text-slate-500">{inst.lastInsp.split(' ')[2]}</p>
                                                </td>
                                                <td className="px-6 py-5">
                                                    {getPriorityBadge(inst.priority)}
                                                </td>
                                                <td className="px-6 py-5 min-w-[180px]">
                                                    <div className="relative">
                                                        <select 
                                                            className="custom-select w-full bg-slate-50 border border-slate-200 text-slate-700 text-sm font-bold rounded-xl px-4 py-2.5 outline-none focus:border-primary-500 focus:bg-white hover:border-slate-300 transition-colors shadow-sm cursor-pointer appearance-none"
                                                            value={assignments[inst.id] || inst.defaultAssign}
                                                            onChange={(e) => handleAssignChange(inst.id, e.target.value)}
                                                        >
                                                            {officers.map(opt => <option key={opt} value={opt}>{opt}</option>)}
                                                        </select>
                                                    </div>
                                                </td>
                                                <td className="px-8 py-5 text-right">
                                                    <button className="bg-primary-800 hover:bg-primary-900 text-white text-xs font-extrabold px-6 py-3 rounded-xl shadow-md hover:shadow-lg active:scale-95 transition-all w-full md:w-auto">
                                                        Assign
                                                    </button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                            
                            <div className="p-6 border-t border-slate-100 bg-slate-50/50 flex items-center justify-between cursor-pointer hover:bg-slate-100 transition-colors group" onClick={() => onNavigate('institutes')}>
                                <div className="flex items-center gap-3">
                                    <div className="w-10 h-10 rounded-xl bg-emerald-100 text-primary-800 flex items-center justify-center"><Icons.ClipboardList /></div>
                                    <span className="font-extrabold text-slate-800 group-hover:text-primary-800 transition-colors">View all institutes</span>
                                </div>
                                <div className="text-slate-400 group-hover:text-primary-700 transition-transform group-hover:translate-x-1"><Icons.ChevronRight /></div>
                            </div>
                        </div>

                    </div>
                </div>
            );
        }

        // ============ MAIN APP CONTROLLER ============
        function App() {
            const [activePage, setActivePage] = useState('assign');

            useEffect(() => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, [activePage]);

            return (
                <div className="flex min-h-screen bg-surface font-sans">
                    <Sidebar active={activePage} setActive={setActivePage} />
                    <div className="ml-64 w-full overflow-hidden relative">
                        <div key={activePage} className="animate-page-enter w-full min-h-screen origin-top">
                            {activePage === 'assign' && <AssignInspectionsPage onNavigate={setActivePage} />}
                            
                            {/* Fallbacks */}
                            {activePage !== 'assign' && (
                                <div className="p-12 text-center text-slate-500 font-medium w-full flex flex-col items-center justify-center min-h-[80vh]">
                                    <p className="text-3xl font-black text-slate-800 capitalize mb-3 tracking-tight">{activePage.replace('-', ' ')} Page</p>
                                    <p className="text-sm mt-4 cursor-pointer bg-white px-6 py-3 rounded-xl border border-slate-200 shadow-sm text-primary-700 font-extrabold hover:bg-slate-50 hover:shadow-md transition-all" onClick={() => setActivePage('assign')}>
                                        Return to Assign Inspections
                                    </p>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // ============ RENDER ============
        ReactDOM.createRoot(document.getElementById('root')).render(
            <ErrorBoundary>
                <App />
            </ErrorBoundary>
        );
    </script>
</body>
</html>
