<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GovWatch - Premium Inspector Platform</title>
    
    <!-- Premium Font Import -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Stable Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'] 
                    },
                    colors: {
                        primary: {
                            50: '#f0fdfa', 100: '#ccfbf1', 200: '#99f6e4', 300: '#5eead4', 
                            400: '#2dd4bf', 500: '#14b8a6', 600: '#0d9488', 700: '#0f766e', 
                            800: '#115e59', 900: '#134e4a', DEFAULT: '#0f766e' 
                        },
                        surface: '#f8fafc',
                    },
                    animation: {
                        'slide-up': 'slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'page-enter': 'pageEnter 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'float': 'float 6s ease-in-out infinite',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(25px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        pageEnter: {
                            '0%': { opacity: '0', transform: 'translateY(15px) scale(0.995)' },
                            '100%': { opacity: '1', transform: 'translateY(0) scale(1)' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Ultra-Stable React & Babel CDNs -->
    <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>

    <style>
        body { background-color: #f8fafc; color: #0f172a; }
        .sidebar-link { transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
        .sidebar-link:hover:not(.active) { background-color: #f1f5f9; transform: translateX(6px); }
        .sidebar-link.active { background-color: #0f766e; color: white; box-shadow: 0 4px 14px rgba(15, 118, 110, 0.25); }
        .sidebar-link.active svg { stroke: white; }
        .animate-page-enter,
        .animate-slide-up { animation: none !important; }
        
        .custom-shadow { box-shadow: 0 12px 40px -12px rgba(0, 0, 0, 0.08); }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .thin-scrollbar::-webkit-scrollbar { width: 5px; }
        .thin-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .thin-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .thin-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Premium Hero Pattern */
        .hero-pattern {
            background-color: #0f766e;
            background-image: radial-gradient(circle at 100% 0%, #115e59 0%, transparent 50%),
                              radial-gradient(circle at 0% 100%, #134e4a 0%, transparent 50%);
            position: relative; overflow: hidden;
        }
        .hero-pattern::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: url('data:image/svg+xml,%3Csvg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg"%3E%3Cg fill="none" fill-rule="evenodd"%3E%3Cg fill="%23ffffff" fill-opacity="0.04"%3E%3Cpath d="M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z"/%3E%3C/g%3E%3C/g%3E%3C/svg%3E');
            animation: float 25s linear infinite;
        }

        /* Custom Dropdown Styling */
        select.custom-select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 0.7rem center;
            background-size: 1em;
        }

        /* Staggered animations */
        .stagger-1 { animation-delay: 0.05s; }
        .stagger-2 { animation-delay: 0.10s; }
        .stagger-3 { animation-delay: 0.15s; }
        .stagger-4 { animation-delay: 0.20s; }
        .stagger-5 { animation-delay: 0.25s; }
    </style>
</head>

            constructor(props) {
                super(props);

            }
            static getDerivedStateFromError(error) { return { hasError: true, errorInfo: error }; }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="p-10 m-10 bg-red-50 border-2 border-red-500 rounded-xl text-red-800 font-mono">
                            <h1 className="text-2xl font-bold mb-4">React Rendering Error</h1>
                            <pre className="bg-white p-4 rounded shadow overflow-auto">{this.state.errorInfo.toString()}</pre>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

                    id: 'CAM-04', type: 'AI Flagged', title: 'Dining hall', loc: 'Rukmini Shelter Home for Women', 
                    statusColor: 'bg-red-500', statusText: 'text-red-600', subBadge: 'Meal service active',
                    time: '10:42 IST', img: 'https://images.unsplash.com/photo-1577412647305-991150c7d163?auto=format&fit=crop&w=600&q=80' 
                }
            ];

            const filteredFeeds = filter === 'All Feeds (18)' ? mockFeeds : mockFeeds.filter(f => filter.includes(f.type));

            return (
                <div className="flex-1 w-full min-h-screen relative pb-10 bg-surface">
                    
                    {/* Premium Hero Header */}
                    <div className="hero-pattern text-white pt-10 pb-36 px-8 lg:px-12 w-full rounded-bl-[2.5rem] rounded-br-[2.5rem] shadow-lg relative z-0">
                        <div className="flex justify-between items-center text-sm font-semibold mb-14 max-w-7xl mx-auto relative z-10">
                            <div className="flex items-center gap-4">
                                <button className="w-11 h-11 rounded-full bg-white/10 flex items-center justify-center hover:bg-white/20 transition backdrop-blur-md border border-white/20 shadow-sm" onClick={() => onNavigate('dashboard')}><Icons.ArrowLeft /></button>
                                <div className="text-emerald-100/70 tracking-wide uppercase text-xs cursor-pointer hover:text-white transition" onClick={() => onNavigate('dashboard')}>Workspace &nbsp;&gt;&nbsp; <span className="text-white font-bold">Live CCTV</span></div>
                            </div>
                        </div>

                        <div className="max-w-7xl mx-auto relative z-10 animate-slide-up flex justify-between items-center">
                            <div>
                                <h2 className="text-4xl lg:text-5xl font-black mb-3 tracking-tight text-white drop-shadow-sm">Live CCTV</h2>
                                <p className="text-emerald-100/90 text-lg font-medium leading-relaxed">Real-time feeds across active institutes</p>
                            </div>
                            <div className="hidden lg:flex w-32 h-32 bg-white/10 rounded-[2rem] backdrop-blur-md border border-white/20 items-center justify-center shadow-lg transform rotate-[-12deg] hover:rotate-0 transition-transform">
                                <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
                            </div>
                        </div>
                    </div>

                    <div className="px-6 lg:px-12 -mt-20 relative z-10 max-w-7xl mx-auto">
                        
                        {/* Floating Control Bar */}
                        <div className="glass-card rounded-[1.5rem] p-4 lg:p-6 custom-shadow border border-white/50 flex flex-col lg:flex-row items-center justify-between gap-6 mb-8 animate-slide-up stagger-1">
                            <div className="flex items-center gap-3 text-slate-400 w-full lg:w-1/2 bg-slate-50/50 px-4 py-3 rounded-xl border border-slate-200">
                                <Icons.Search />
                                <input type="text" placeholder="Search institutes, IDs, district..." value={search} onChange={(e) => setSearch(e.target.value)} className="w-full bg-transparent text-[0.95rem] text-slate-800 font-bold outline-none placeholder:font-semibold placeholder:text-slate-400" />
                            </div>
                            <div className="flex items-center gap-4 text-slate-400 border-l border-slate-200 pl-4 cursor-pointer hover:text-primary-700 transition-colors">
                                <Icons.Sliders />
                            </div>
                        </div>

                        {/* Filters */}
                        <div className="flex gap-2.5 overflow-x-auto no-scrollbar w-full animate-slide-up stagger-2 mb-8">
                            {filters.map(f => {
                                const isActive = filter === f.id;
                                return (
                                    <button 
                                        key={f.id} onClick={() => setFilter(f.id)}
                                        className={`px-6 py-3 rounded-[1.25rem] text-sm tracking-wide font-extrabold whitespace-nowrap transition-all border-2 shadow-sm flex items-center gap-2 ${
                                            isActive 
                                            ? 'bg-primary-800 text-white border-primary-800 scale-[1.02]' 
                                            : 'bg-white text-primary-700 border-emerald-100 hover:border-primary-300 hover:bg-emerald-50'
                                        }`}
                                    >
                                        {f.id}
                                        {f.dot && isActive && <span className={`w-2 h-2 rounded-full ${f.dot}`}></span>}
                                    </button>
                                );
                            })}
                        </div>

                        {/* Grid of CCTV Feeds */}
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8 mb-12">
                            {filteredFeeds.map((feed, idx) => (
                                <div key={feed.id} className={`bg-white rounded-[1.5rem] p-4 custom-shadow border border-slate-100 flex flex-col group hover:shadow-xl transition-all duration-300 stagger-${(idx % 4) + 1} animate-slide-up cursor-pointer`}>
                                    
                                    {/* Video Thumbnail Area */}
                                    <div className="h-48 w-full relative overflow-hidden rounded-[1rem] bg-slate-900 mb-4">
                                        <img src={feed.img} alt={feed.title} className="w-full h-full object-cover opacity-85 group-hover:scale-105 transition-transform duration-700" />
                                        
                                        {/* Overlays */}
                                        <div className={`absolute top-3 left-3 text-white px-2.5 py-1 rounded-lg text-[0.65rem] font-black tracking-widest uppercase flex items-center gap-2 shadow-md backdrop-blur-md ${feed.type === 'Live' ? 'bg-emerald-500/90' : 'bg-red-500/90'}`}>
                                            <div className="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></div> {feed.type}
                                        </div>
                                        
                                        <div className="absolute top-3 right-3 bg-black/60 text-white px-2.5 py-1 rounded-lg backdrop-blur-md text-[0.65rem] font-bold shadow-md">
                                            {feed.time}
                                        </div>
                                        
                                        <div className="absolute bottom-3 left-3 bg-black/50 text-white p-2 rounded-lg backdrop-blur-md">
                                            <Icons.CameraIcon />
                                        </div>
                                        
                                        <div className="absolute bottom-3 right-3 bg-black/50 text-white p-2 rounded-lg backdrop-blur-md hover:bg-black/70 transition">
                                            <Icons.Expand />
                                        </div>
                                    </div>

                                    {/* Content Details */}
                                    <div className="flex-1 flex flex-col relative px-2">
                                        <div className="flex items-start justify-between mb-1">
                                            <h4 className="text-[1.05rem] font-extrabold text-slate-800 tracking-tight leading-snug pr-2 group-hover:text-primary-800 transition-colors">{feed.title}</h4>
                                            <div className={`flex items-center gap-1.5 px-2 py-0.5 rounded-full bg-slate-50 border border-slate-100 ${feed.statusText} text-[0.65rem] font-bold tracking-wide uppercase shrink-0`}>
                                                <div className={`w-1.5 h-1.5 rounded-full ${feed.statusColor}`}></div> {feed.type}
                                            </div>
                                        </div>
                                        
                                        <p className="text-xs text-slate-500 font-semibold mb-3">{feed.loc}</p>
                                        
                                        {feed.subBadge && (
                                            <div className="mb-3">
                                                <span className="inline-flex items-center gap-1.5 px-2 py-1 rounded border bg-amber-50 text-amber-700 border-amber-200 text-[0.65rem] font-bold">
                                                    <div className="w-1.5 h-1.5 rounded-full bg-amber-500"></div> {feed.subBadge}
                                                </span>
                                            </div>
                                        )}

                                        {/* Action Bar */}
                                        <div className="flex items-center justify-between mt-auto pt-4 border-t border-slate-100">
                                            <div className="flex gap-4 text-slate-400">
                                                <div className="hover:text-primary-700 transition cursor-pointer"><Icons.CameraIcon /></div>
                                                <div className="hover:text-primary-700 transition cursor-pointer"><Icons.Settings /></div>
                                            </div>
                                            <div className="text-slate-300 group-hover:text-primary-700 transition transform group-hover:translate-x-1">
                                                <Icons.ChevronRight />
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                        
                        {/* System Status Desktop Footer (Adapted from Mobile Bottom Nav) */}
                        <div className="bg-white rounded-[1.5rem] p-6 custom-shadow border border-slate-100 animate-slide-up grid grid-cols-2 md:grid-cols-4 gap-6 mb-10">
                            <div className="flex flex-col items-center justify-center text-center p-2 border-r border-slate-100">
                                <div className="text-primary-700 mb-2"><Icons.CheckCircle /></div>
                                <h4 className="font-extrabold text-slate-800 text-sm">Live Monitoring</h4>
                                <p className="text-xs text-slate-500 font-semibold mt-1">18 active feeds</p>
                            </div>
                            <div className="flex flex-col items-center justify-center text-center p-2 md:border-r border-slate-100">
                                <div className="text-primary-700 mb-2"><Icons.Alert /></div>
                                <h4 className="font-extrabold text-slate-800 text-sm">AI Analysis</h4>
                                <p className="text-xs text-slate-500 font-semibold mt-1">4 flagged events</p>
                            </div>
                            <div className="flex flex-col items-center justify-center text-center p-2 border-r border-slate-100">
                                <div className="text-primary-700 mb-2"><Icons.Video /></div>
                                <h4 className="font-extrabold text-slate-800 text-sm">Quick Actions</h4>
                                <p className="text-xs text-slate-500 font-semibold mt-1">Verify / Inspect</p>
                            </div>
                            <div className="flex flex-col items-center justify-center text-center p-2">
                                <div className="text-primary-700 mb-2"><Icons.Shield /></div>
                                <h4 className="font-extrabold text-slate-800 text-sm">24/7 Surveillance</h4>
                                <p className="text-xs text-slate-500 font-semibold mt-1">For safer communities</p>
                            </div>
                        </div>

                    </div>
                </div>
            );
        }

        // ============ MAIN APP CONTROLLER ============
        function App() {
            const [activePage, setActivePage] = useState('cctv');
            const routes = {
                dashboard: 'dashboard.html',
                inspection: 'field.html',
                cctv: 'cctv_feed.html',
                alerts: 'ai_anomaly.html',
                institutes: 'institutes_directory.html',
                assign: 'inspections.html',
                video: 'video_verification.html'
            };
            const navigateToPage = (page) => {
                if (routes[page]) window.location.href = routes[page];
            };

            useEffect(() => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, [activePage]);

            return (
                <div className="flex min-h-screen bg-surface font-sans">
                    <Sidebar active={activePage} setActive={navigateToPage} />
                    <div className="ml-64 w-full overflow-hidden relative">
                        <div key={activePage} className="animate-page-enter w-full min-h-screen origin-top">
                            {activePage === 'cctv' && <LiveCCTVPage onNavigate={navigateToPage} />}
                            
                            {/* Fallbacks */}
                            {activePage !== 'cctv' && (
                                <div className="p-12 text-center text-slate-500 font-medium w-full flex flex-col items-center justify-center min-h-[80vh]">
                                    <p className="text-3xl font-black text-slate-800 capitalize mb-3 tracking-tight">{activePage.replace('-', ' ')} Page</p>
                                    <p className="text-sm mt-4 cursor-pointer bg-white px-6 py-3 rounded-xl border border-slate-200 shadow-sm text-primary-700 font-extrabold hover:bg-slate-50 hover:shadow-md transition-all" onClick={() => setActivePage('cctv')}>
                                        Return to Live CCTV
                                    </p>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // ============ RENDER ============
        ReactDOM.createRoot(document.getElementById('root')).render(
            <ErrorBoundary>
                <App />
            </ErrorBoundary>
        );
    </script>
</body>
</html>
